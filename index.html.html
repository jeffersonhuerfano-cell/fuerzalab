<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FuerzaLab - Simulador de Fuerzas y Movimiento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h1 { color: #1e3a8a; margin-bottom: 5px; }
    p.subtitle { color: #4b5563; font-size: 0.95rem; margin-bottom: 20px; }
    
    .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1100px; width: 100%; }
    
    .panel-controls { flex: 1; min-width: 300px; background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .panel-simulation { flex: 2; min-width: 500px; background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; }
    
    .control-group { margin-bottom: 15px; }
    label { font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px; }
    input[type="range"], select { width: 100%; padding: 5px; }
    .val-display { font-weight: normal; color: #2563eb; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: #fff; transition: 0.2s; }
    .btn-start { background-color: #10b981; }
    .btn-start:hover { background-color: #059669; }
    .btn-reset { background-color: #ef4444; }
    .btn-reset:hover { background-color: #dc2626; }
    
    canvas { background-color: #eef2ff; border: 2px solid #cbd5e1; border-radius: 8px; width: 100%; height: 320px; }
    
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; margin-top: 15px; }
    .metric-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; text-align: center; }
    .metric-card h4 { font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
    .metric-card p { font-size: 1.1rem; font-weight: bold; color: #0f172a; margin-top: 5px; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-top: 10px; }
    .status-eq { background-color: #d1fae5; color: #065f46; }
    .status-uneq { background-color: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <h1>FuerzaLab</h1>
  <p class="subtitle">Simulador de Fuerzas Equilibradas, Desequilibradas y Movimiento Vectorial</p>

  <div class="container">
    <!-- Panel de Controles -->
    <div class="panel-controls">
      <h3>Configuración del Escenario</h3>
      <hr style="margin: 10px 0;"><br>

      <div class="control-group">
        <label for="scenarioSelect">Escenario Cotidiano:</label>
        <select id="scenarioSelect" onchange="loadScenario()">
          <option value="custom">Personalizado</option>
          <option value="box">Empujar una caja pesada en el suelo</option>
          <option value="tugofwar">Juego de tirar la cuerda (Fuerzas Opuestas)</option>
          <option value="ice">Desplazamiento sobre hielo (Sin Fricción)</option>
        </select>
      </div>

      <div class="control-group">
        <label>Fuerza Aplicada Izquierda ($F_1$): <span id="valF1" class="val-display">0 N</span></label>
        <input type="range" id="inputF1" min="0" max="500" value="0" oninput="updateValues()">
      </div>

      <div class="control-group">
        <label>Fuerza Aplicada Derecha ($F_2$): <span id="valF2" class="val-display">100 N</span></label>
        <input type="range" id="inputF2" min="0" max="500" value="100" oninput="updateValues()">
      </div>

      <div class="control-group">
        <label>Masa del Objeto ($m$): <span id="valMass" class="val-display">10 kg</span></label>
        <input type="range" id="inputMass" min="1" max="100" value="10" oninput="updateValues()">
      </div>

      <div class="control-group">
        <label>Coeficiente de Fricción ($\mu$): <span id="valFriction" class="val-display">0.20</span></label>
        <input type="range" id="inputFriction" min="0" max="1" step="0.05" value="0.20" oninput="updateValues()">
      </div>

      <div class="btn-group">
        <button id="btnPlay" class="btn-start" onclick="toggleSimulation()">Iniciar / Pausar</button>
        <button class="btn-reset" onclick="resetSimulation()">Reiniciar</button>
      </div>

      <div style="margin-top: 15px; text-align: center;">
        <span id="statusBadge" class="status-badge status-eq">Fuerzas Equilibradas ($F_{\text{net}} = 0$)</span>
      </div>
    </div>

    <!-- Panel de Simulación Visual -->
    <div class="panel-simulation">
      <canvas id="simCanvas" width="600" height="320"></canvas>

      <div class="metrics">
        <div class="metric-card">
          <h4>Fuerza Resultante</h4>
          <p id="metricFnet">0.0 N</p>
        </div>
        <div class="metric-card">
          <h4>Aceleración</h4>
          <p id="metricAcc">0.00 m/s²</p>
        </div>
        <div class="metric-card">
          <h4>Velocidad</h4>
          <p id="metricVel">0.00 m/s</p>
        </div>
        <div class="metric-card">
          <h4>Posición</h4>
          <p id="metricPos">0.0 m</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // Estado físico del sistema
    let state = {
      f1: 0,           // N (hacia la izquierda)
      f2: 100,         // N (hacia la derecha)
      mass: 10,        // kg
      mu: 0.20,        // Coeficiente de fricción
      g: 9.81,         // m/s^2
      x: 50,           // Posición gráfica px
      v: 0,            // m/s
      a: 0,            // m/s^2
      fNet: 0,         // N
      fFriction: 0,    // N
      isRunning: false
    };

    let lastTime = null;

    function updateValues() {
      state.f1 = parseFloat(document.getElementById('inputF1').value);
      state.f2 = parseFloat(document.getElementById('inputF2').value);
      state.mass = parseFloat(document.getElementById('inputMass').value);
      state.mu = parseFloat(document.getElementById('inputFriction').value);

      document.getElementById('valF1').innerText = state.f1 + ' N';
      document.getElementById('valF2').innerText = state.f2 + ' N';
      document.getElementById('valMass').innerText = state.mass + ' kg';
      document.getElementById('valFriction').innerText = state.mu.toFixed(2);

      calculatePhysics();
      draw();
    }

    function loadScenario() {
      const scenario = document.getElementById('scenarioSelect').value;
      if (scenario === 'box') {
        document.getElementById('inputF1').value = 0;
        document.getElementById('inputF2').value = 150;
        document.getElementById('inputMass').value = 25;
        document.getElementById('inputFriction').value = 0.40;
      } else if (scenario === 'tugofwar') {
        document.getElementById('inputF1').value = 200;
        document.getElementById('inputF2').value = 200;
        document.getElementById('inputMass').value = 15;
        document.getElementById('inputFriction').value = 0.10;
      } else if (scenario === 'ice') {
        document.getElementById('inputF1').value = 0;
        document.getElementById('inputF2').value = 50;
        document.getElementById('inputMass').value = 10;
        document.getElementById('inputFriction').value = 0.00;
      }
      updateValues();
      resetSimulation();
    }

    function calculatePhysics() {
      const fAppliedNet = state.f2 - state.f1; // Derecha positiva, Izquierda negativa
      const normalForce = state.mass * state.g;
      const maxStaticFriction = state.mu * normalForce;

      if (Math.abs(state.v) < 0.001) {
        // Objeto en reposo
        if (Math.abs(fAppliedNet) <= maxStaticFriction) {
          state.fFriction = -fAppliedNet;
          state.fNet = 0;
          state.a = 0;
          state.v = 0;
        } else {
          state.fFriction = -Math.sign(fAppliedNet) * maxStaticFriction;
          state.fNet = fAppliedNet + state.fFriction;
          state.a = state.fNet / state.mass;
        }
      } else {
        // Objeto en movimiento (fricción cinética)
        state.fFriction = -Math.sign(state.v) * maxStaticFriction;
        state.fNet = fAppliedNet + state.fFriction;

        // Si la fuerza neta opone el movimiento y detiene al objeto
        state.a = state.fNet / state.mass;
      }

      // Actualización de badge de estado
      const badge = document.getElementById('statusBadge');
      if (Math.abs(state.fNet) < 0.01) {
        badge.className = "status-badge status-eq";
        badge.innerText = "Fuerzas Equilibradas (F_net = 0 N)";
      } else {
        badge.className = "status-badge status-uneq";
        badge.innerText = "Fuerzas Desequilibradas (F_net = " + state.fNet.toFixed(1) + " N)";
      }

      // Actualizar UI
      document.getElementById('metricFnet').innerText = state.fNet.toFixed(1) + ' N';
      document.getElementById('metricAcc').innerText = state.a.toFixed(2) + ' m/s²';
      document.getElementById('metricVel').innerText = state.v.toFixed(2) + ' m/s';
      document.getElementById('metricPos').innerText = (state.x / 10).toFixed(1) + ' m';
    }

    function updatePhysics(dt) {
      if (!state.isRunning) return;

      calculatePhysics();

      // Integración Euler
      state.v += state.a * dt;

      // Detener en reposo por fricción cuando v cambia de signo
      if ((state.v > 0 && state.a < 0 && (state.f2 - state.f1) === 0) || 
          (state.v < 0 && state.a > 0 && (state.f2 - state.f1) === 0)) {
        if (Math.abs(state.v) < 0.05) state.v = 0;
      }

      state.x += state.v * dt * 20; // Escalado visual px/m

      // Límites de pantalla (rebote/reinicio)
      if (state.x < 40) { state.x = 40; state.v = 0; }
      if (state.x > canvas.width - 90) { state.x = canvas.width - 90; state.v = 0; }
    }

    function drawArrow(fromX, fromY, toX, toY, color, label) {
      const headLength = 10;
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);

      if (Math.hypot(dx, dy) < 5) return; // No dibujar vectores casi nulos

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
      ctx.goto = toX;
      ctx.fill();

      // Etiqueta
      ctx.font = "bold 12px sans-serif";
      ctx.fillText(label, toX + (dx >= 0 ? 5 : -40), toY - 8);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar Suelo
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(0, 240, canvas.width, 80);
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 240);
      ctx.lineTo(canvas.width, 240);
      ctx.stroke();

      // Dibujar Objeto (Caja)
      const boxWidth = 60;
      const boxHeight = 50;
      const boxY = 240 - boxHeight;

      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(state.x, boxY, boxWidth, boxHeight);
      ctx.strokeStyle = '#1d4ed8';
      ctx.strokeRect(state.x, boxY, boxWidth, boxHeight);

      // Texto de masa
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(state.mass + ' kg', state.x + 10, boxY + 30);

      // Puntos de referencia para vectores
      const centerY = boxY + boxHeight / 2;
      const rightX = state.x + boxWidth;
      const leftX = state.x;

      // Escala de vectores: 1 N = 0.5 px
      const scale = 0.4;

      // Vector F2 (Derecha - Azul)
      if (state.f2 > 0) {
        drawArrow(rightX, centerY, rightX + state.f2 * scale, centerY, '#2563eb', `F2 = ${state.f2}N`);
      }

      // Vector F1 (Izquierda - Rojo)
      if (state.f1 > 0) {
        drawArrow(leftX, centerY, leftX - state.f1 * scale, centerY, '#dc2626', `F1 = ${state.f1}N`);
      }

      // Vector Fricción (Naranja)
      if (Math.abs(state.fFriction) > 0.1) {
        const fricX = state.fFriction > 0 ? rightX : leftX;
        drawArrow(fricX, 240, fricX + state.fFriction * scale, 240, '#d97706', `f = ${Math.abs(state.fFriction).toFixed(1)}N`);
      }

      // Vector Fuerza Resultante (Verde - Arriba del objeto)
      if (Math.abs(state.fNet) > 0.1) {
        const centerX = state.x + boxWidth / 2;
        drawArrow(centerX, boxY - 15, centerX + state.fNet * scale, boxY - 15, '#10b981', `F_net = ${state.fNet.toFixed(1)}N`);
      }
    }

    function toggleSimulation() {
      state.isRunning = !state.isRunning;
      const btn = document.getElementById('btnPlay');
      if (state.isRunning) {
        btn.innerText = "Pausar";
        btn.style.backgroundColor = "#f59e0b";
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      } else {
        btn.innerText = "Reanudar";
        btn.style.backgroundColor = "#10b981";
      }
    }

    function resetSimulation() {
      state.isRunning = false;
      state.x = 50;
      state.v = 0;
      state.a = 0;
      document.getElementById('btnPlay').innerText = "Iniciar";
      document.getElementById('btnPlay').style.backgroundColor = "#10b981";
      updateValues();
    }

    function gameLoop(time) {
      if (!state.isRunning) return;
      const dt = (time - lastTime) / 1000;
      lastTime = time;

      updatePhysics(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    // Inicialización
    updateValues();
  </script>
</body>
</html>
